openapi: 3.0.3
info:
  title: Limit Order Market Simulator API
  description: REST API for managing and simulating a limit order book, users, and trading strategies.
  version: 1.0.0
  contact:
    name: MrEll3n
    email: mail@mrellen.eu
servers:
  - url: http://localhost:8000/api
    description: Local development server

paths:
  /login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, returns JWT tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid login credentials
      tags:
        - Auth

  /orders:
    get:
      summary: Get list of orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
      tags:
        - Orders

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        product:
          type: string
        side:
          type: string
          enum: [buy, sell]
        price:
          type: number
        quantity:
          type: number
        status:
          type: string
          enum: [open, filled, cancelled]
      required:
        - id
        - product
        - side
        - price
        - quantity
        - status
